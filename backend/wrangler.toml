name = "lida-backend"
main = "src/index.js"
compatibility_date = "2024-06-16"
compatibility_flags = ["nodejs_compat"]

# Persistent editable website content. Create the production database and set its ID before deploying.
[[d1_databases]]
binding = "CONTENT_DB"
database_name = "lida-content"
database_id = "8f324a3e-45cc-4e9c-9e18-a44b8d4ee517"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

# ── KV Namespace ─────────────────────────────────────────────
# Stores contact form submissions AND admin content overrides.
#
# To create (run once):
#   npx wrangler kv namespace create CONTACT_SUBMISSIONS
#   npx wrangler kv namespace create CONTACT_SUBMISSIONS --preview
#
# Then replace the placeholder IDs below with the output IDs.
[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "fe714b8c616d4ce4902f273d7a8af799"
preview_id = "87b4215ea5a44b2bb0315b5a704eb119"

# ── R2 Bucket for Media Storage ──────────────────────────────
# For admin media uploads (images, documents, assets)
#
# To create (run once):
#   npx wrangler r2 bucket create lida-media
#
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "lida-media"

# ── Secrets (set via CLI, never in this file) ─────────────────
# npx wrangler secret put ADMIN_API_KEY
# npx wrangler secret put RESEND_API_KEY
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put ADMIN_USERNAME
# npx wrangler secret put ADMIN_PASSWORD_HASH
#
# ADMIN_API_KEY       — shared secret for admin panel (X-Admin-Key header)
# RESEND_API_KEY      — API key from resend.com (re_xxxxxxxx)
# JWT_SECRET          — secret for JWT token signing (generate: openssl rand -base64 32)
# ADMIN_USERNAME      — admin login username
# ADMIN_PASSWORD_HASH — bcrypt hash of admin password (generate online or via bcrypt)

# ── Environment variables ─────────────────────────────────────
[vars]
CONTACT_EMAIL_TO = "Projects@lidadigital.com.ng"
CONTACT_EMAIL_FROM = "Lida Digital <noreply@lida.ng>"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://lida.ng,https://www.lida.ng,https://admin.lida.ng,https://lida-admin.pages.dev,https://lida-app.pages.dev"
JWT_EXPIRY = "24h"
MAX_UPLOAD_SIZE = "10485760"  # 10MB in bytes
ALLOWED_FILE_TYPES = "image/jpeg,image/png,image/webp,image/gif,application/pdf"

# ── Local dev overrides ───────────────────────────────────────
[env.dev]
[[env.dev.d1_databases]]
binding = "CONTENT_DB"
database_name = "lida-content"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.dev.vars]
CONTACT_EMAIL_TO = "Projects@lidadigital.com.ng"
CONTACT_EMAIL_FROM = "Lida Digital <noreply@lida.ng>"
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:3000"
JWT_EXPIRY = "24h"
MAX_UPLOAD_SIZE = "10485760"
ALLOWED_FILE_TYPES = "image/jpeg,image/png,image/webp,image/gif,application/pdf"

[[env.dev.kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "fe714b8c616d4ce4902f273d7a8af799"
preview_id = "87b4215ea5a44b2bb0315b5a704eb119"

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "lida-media"
