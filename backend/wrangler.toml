name = "solutions-media-backend"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Dedicated Solutions Media production storage.
[[d1_databases]]
binding = "CONTENT_DB"
database_name = "solutions-media-content"
database_id = "bb8a759c-e9e8-4a7c-835f-b353d3e51c5c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "solutions-media-media"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://solutionmediadigital.com,https://www.solutionmediadigital.com,https://admin.solutionmediadigital.com,https://solutionsmedia-app.pages.dev,https://solutionsmedia-admin.pages.dev"
MAX_UPLOAD_SIZE = "10485760"
ALLOWED_FILE_TYPES = "image/jpeg,image/png,image/webp,image/gif,application/pdf"
CONTACT_EMAIL_TO = "hello@solutionmediaglobal.com.ng"
CONTACT_EMAIL_FROM = "Solutions Media <noreply@solutionmediaglobal.com.ng>"

[env.dev.vars]
CONTACT_EMAIL_TO = "hello@solutionmediaglobal.com.ng"
CONTACT_EMAIL_FROM = "Solutions Media <noreply@solutionmediaglobal.com.ng>"
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5174,http://127.0.0.1:5174"
MAX_UPLOAD_SIZE = "10485760"
ALLOWED_FILE_TYPES = "image/jpeg,image/png,image/webp,image/gif,application/pdf"

[[env.dev.d1_databases]]
binding = "CONTENT_DB"
database_name = "solutions-media-content-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "solutions-media-media-local"
