# Isolated, local-only content integration test configuration.
name = "lida-content-test"
main = "../src/index.js"
compatibility_date = "2024-06-16"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "local-content-integration-test-only"
ALLOWED_ORIGINS = "http://127.0.0.1:5194,http://127.0.0.1:3004"

[[d1_databases]]
binding = "CONTENT_DB"
database_name = "lida-content-test"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "lida-media-test"

